version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cyberheist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberheist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberheist_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cyberheist_db}
    ports:
      - "${AIDLC_DB_PORT:-0}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberheist} -d ${POSTGRES_DB:-cyberheist_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cyberheist-network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: cyberheist-api
    restart: unless-stopped
    environment:
      PORT: 8000
      API_PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-cyberheist}:${POSTGRES_PASSWORD:-cyberheist_secret}@db:5432/${POSTGRES_DB:-cyberheist_db}
      JWT_SECRET: ${JWT_SECRET:-cyberheist_jwt_super_secret_key_2026}
      NODE_ENV: production
    ports:
      - "${AIDLC_API_PORT:-0}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyberheist-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: cyberheist-frontend
    restart: unless-stopped
    ports:
      - "${AIDLC_FRONTEND_PORT:-0}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyberheist-network

volumes:
  pgdata:

networks:
  cyberheist-network:
    driver: bridge
